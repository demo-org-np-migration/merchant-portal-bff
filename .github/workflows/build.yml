name: build

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE: ghcr.io/demo-org-np-migration/merchant-portal-bff

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.tag.outputs.sha_tag }}
    env:
      NULLPLATFORM_API_KEY: ${{ secrets.NULLPLATFORM_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # nullplatform: el build queda registrado con su commit, rama y run. Si nullplatform falla, el build sigue igual.
      - name: nullplatform - install CLI
        continue-on-error: true
        run: |
          curl -fsSL https://cli.nullplatform.com/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: nullplatform - build start
        id: np_build
        continue-on-error: true
        run: |
          np build start --format json > np-build.json
          echo "id=$(jq -r '.id // empty' np-build.json)" >> "$GITHUB_OUTPUT"
          echo "application_id=$(jq -r '.application_id // empty' np-build.json)" >> "$GITHUB_OUTPUT"

      - name: Compute short sha tag
        id: tag
        run: echo "sha_tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.sha_tag }}
            ${{ env.IMAGE }}:latest

      # nullplatform: registra la imagen que ya subió el paso anterior (la misma URL de ghcr, sin copiarla).
      - name: nullplatform - asset
        if: steps.np_build.outputs.id != ''
        continue-on-error: true
        run: |
          jq -nc \
            --argjson build_id "${{ steps.np_build.outputs.id }}" \
            --argjson application_id "${{ steps.np_build.outputs.application_id }}" \
            --arg url "${{ env.IMAGE }}:${{ steps.tag.outputs.sha_tag }}" \
            --arg digest "${{ steps.build.outputs.digest }}" \
            '{build_id: $build_id, application_id: $application_id, name: "main", type: "docker-image", url: $url, metadata: {digest: $digest}}' > asset.json
          np asset create --body asset.json

      - name: nullplatform - build status
        if: always() && steps.np_build.outputs.id != ''
        continue-on-error: true
        run: np build update --id "${{ steps.np_build.outputs.id }}" --status "${{ job.status == 'success' && 'successful' || 'failed' }}"

  update-gitops-staging:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gitops
        uses: actions/checkout@v4
        with:
          repository: demo-org-np-migration/gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Bump staging image tag
        working-directory: gitops
        env:
          SHA_TAG: ${{ needs.build-and-push.outputs.sha_tag }}
        run: |
          yq -i '.image.tag = strenv(SHA_TAG)' apps/merchant-portal-bff/values-staging.yaml
          git config user.name "cauri-bot"
          git config user.email "cauri-bot@cauri.io"
          git add apps/merchant-portal-bff/values-staging.yaml
          git commit -m "chore(merchant-portal-bff): staging ${SHA_TAG}"
          for _ in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then break; fi
            sleep $((RANDOM % 5 + 2))
          done
  update-gitops-prod:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gitops
        uses: actions/checkout@v4
        with:
          repository: demo-org-np-migration/gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Bump prod image tag
        working-directory: gitops
        env:
          SHA_TAG: ${{ needs.build-and-push.outputs.sha_tag }}
        run: |
          yq -i '.image.tag = strenv(SHA_TAG)' apps/merchant-portal-bff/values-prod.yaml
          git config user.name "cauri-bot"
          git config user.email "cauri-bot@cauri.io"
          git add apps/merchant-portal-bff/values-prod.yaml
          git commit -m "chore(merchant-portal-bff): prod ${SHA_TAG}"
          for _ in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then break; fi
            sleep $((RANDOM % 5 + 2))
          done