# Defaults de staging. Los values de staging/prod "de verdad" viven en el repo gitops
# (apps/merchant-portal-bff/values-<env>.yaml); build.yml bumpea image.tag ahí en cada
# push a main (y values-prod.yaml al taggear v*). Este archivo es lo que Argo CD usa
# como base del chart.

image:
  repository: ghcr.io/demo-org-np-migration/merchant-portal-bff
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

# Variables de entorno no sensibles (las convenciones internas de API, #2 y spec merchant-portal-bff). Van
# a un ConfigMap y se montan con envFrom. Este servicio no tiene base propia (no hay
# credenciales de Postgres que montar); lo único sensible es el client secret de
# Keycloak, que sale del Secret `keycloak-client-merchant-portal-bff` y nunca entra acá.
env:
  SERVICE_NAME: merchant-portal-bff
  ENV: staging
  PORT: "8080"
  LOG_LEVEL: info
  KEYCLOAK_ISSUER: http://keycloak.platform.svc:8080/realms/cauri-staging
  KEYCLOAK_CLIENT_ID: merchant-portal-bff
  PAYMENTS_API_URL: http://payments-api:8080
  ACCOUNTS_API_URL: http://accounts-api:8080

secrets:
  keycloak:
    name: keycloak-client-merchant-portal-bff
    clientSecretKey: client_secret

podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
