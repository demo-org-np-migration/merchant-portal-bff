apiVersion: v1
kind: Service
metadata:
  name: merchant-portal-bff
  labels:
    {{- include "merchant-portal-bff.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: merchant-portal-bff
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
